name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Determinar nombre del binario
        id: binary
        shell: bash
        run: |
          OS_LABEL=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "artifact_name=weather-${OS_LABEL}" >> $GITHUB_OUTPUT
            echo "binary_path=out/weather.exe" >> $GITHUB_OUTPUT
          else
            echo "artifact_name=weather-${OS_LABEL}" >> $GITHUB_OUTPUT
            echo "binary_path=out/weather" >> $GITHUB_OUTPUT
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.binary.outputs.artifact_name }}
          path: ${{ steps.binary.outputs.binary_path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extraer versión del package.json
        id: version
        run: echo "version=v$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
      - name: Aplanar binarios fuera de los directorios de artefacto
        shell: bash
        run: |
          for dir in weather-*/; do
            dir=${dir%/}
            binary=$(find "$dir" -type f | head -1)
            ext="${binary##*.}"
            if [ "$ext" = "exe" ]; then
              mv "$binary" "${dir}.exe"
            else
              mv "$binary" "${dir}.bin"
            fi
            rmdir "$dir"
            if [ "$ext" != "exe" ]; then
              mv "${dir}.bin" "$dir"
            fi
          done
      - name: Crear o actualizar release con gh CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --json tagName &>/dev/null; then
            echo "Release $TAG ya existe — subiendo binarios..."
            gh release upload "$TAG" weather-* --clobber
          else
            echo "Creando release $TAG..."
            gh release create "$TAG" weather-* \
              --generate-notes \
              --title "Release $TAG"
          fi
